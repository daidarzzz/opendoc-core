[package]
name = "opendoc-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Core logic for OpenDoc: docset scanning, indexing, and search"
repository = "https://github.com/daidarzzz/opendoc-core"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
plist = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
nucleo-matcher = "0.3.1"
base64 = "0.22"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
